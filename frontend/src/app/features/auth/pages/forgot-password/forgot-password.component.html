<div class="recover-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">Recover your account</h2>
    </div>

    <form (ngSubmit)="send()" novalidate>
      <div class="field-group">
        <label for="recovery-email">Registered Email address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            id="recovery-email"
            class="form-control"
            type="email"
            [formControl]="email"
            placeholder="Enter your registered email address"
            autocomplete="email"
          >
        </div>
        @if (email.touched && email.invalid) {
          <small class="field-error">Please enter a valid registered email address.</small>
        }
      </div>

      <p class="recovery-help-text">
        We confirm your identity through the registered recovery method.
      </p>

      @if (sent()) {
        <div class="alert alert-success">
          Demo recovery instructions have been sent to your email.
        </div>
      }

      <div class="button-group">
        <a routerLink="/auth/login" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-submit" [disabled]="email.invalid && email.touched">
          Send Recovery Link
        </button>
      </div>
    </form>
  </div>
</div>
