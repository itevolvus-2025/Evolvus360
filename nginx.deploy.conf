# ==============================================================================
# Nginx Production Deployment Configuration for Evolvus360
# ==============================================================================

upstream hrms_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream email_service {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hrms.evolvus.com;

    # Redirect all HTTP requests to HTTPS in production
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body limit (allows KYC/cheque uploads up to 10MB)
    client_max_body_size 10M;

    # API Reverse Proxy Routing -> HRMS FastAPI Backend
    location /api/v1/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Static Assets Caching (Fingerprinted bundles)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Runtime deployment configuration (never cache)
    location = /config/deployment.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Angular SPA Fallback (HTML5 PushState routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
